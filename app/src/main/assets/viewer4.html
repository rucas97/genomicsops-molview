<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  /* Force the body to be exactly the screen size */
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #ff0000; overflow: hidden; }
  /* Ensure the canvas generated by 3Dmol fills the screen */
  canvas { width: 100vw !important; height: 100vh !important; display: block !important; }
  #msg { position: absolute; top: 20px; left: 20px; z-index: 9999; color: white; background: black; padding: 10px; font-size: 14px; font-family: monospace; }
</style>
</head>
<body>
<div id="msg">Initializing...</div>
<script>
  var msg = document.getElementById('msg');
  
  if (typeof $3Dmol === 'undefined') {
    msg.innerText = "ERROR: 3Dmol.js failed to load.";
  } else {
    try {
      // Render directly into the body tag instead of a div
      var viewer = $3Dmol.createViewer(document.body, { backgroundColor: '#0000ff' });
      
      // Draw a test sphere
      viewer.addSphere({center: {x:0, y:0, z:0}, radius: 10, color: 'red'});
      viewer.zoomTo();
      viewer.render();
      
      // Check the actual pixel size of the canvas
      var canvas = document.querySelector('canvas');
      var sizeText = canvas ? (canvas.width + "x" + canvas.height) : "Canvas not found";
      
      msg.innerText = "SUCCESS!\nCanvas Size: " + sizeText;
      
      setTimeout(function() { msg.style.display = 'none'; }, 4000);
      
    } catch(e) {
      msg.innerText = "Error: " + e.message;
    }
  }
</script>
</body>
</html>
