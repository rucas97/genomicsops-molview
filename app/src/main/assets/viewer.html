<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #06080A; overflow: hidden; width: 100%; height: 100%; }
  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #06080A; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#06080A' });
  var currentModel = null;
  var currentRep = 'cartoon';
  var currentColor = 'spectrum';

  function loadModel(data, ext) {
    try {
      viewer.removeAllModels();
      viewer.removeAllSurfaces();
      currentModel = viewer.addModel(data, ext);
      viewer.zoomTo();
      setRep(currentRep);
    } catch(e) {
      if (typeof AndroidLogger !== 'undefined') AndroidLogger.log("Parse Error: " + e.message);
    }
  }

  function setRep(rep) {
    currentRep = rep;
    if (!currentModel) return;
    viewer.removeAllSurfaces();
    
    if (rep === 'cartoon') {
      viewer.setStyle({}, { cartoon: { color: currentColor } });
      viewer.render();
    } 
    else if (rep === 'surface') {
      viewer.setStyle({}, { cartoon: { color: currentColor } });
      viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.85, color: 'white' }, { model: currentModel });
      viewer.render();
    } 
    else if (rep === 'ballstick') {
      viewer.setStyle({}, { stick: { radius: 0.15 }, sphere: { scale: 0.25 } });
      viewer.render();
    } 
    else if (rep === 'stick') {
      viewer.setStyle({}, { stick: { radius: 0.15 } });
      viewer.render();
    }
  }

  function setColor(scheme) {
    currentColor = scheme;
    if (!currentModel) return;
    if (currentRep === 'cartoon' || currentRep === 'surface') {
      viewer.setStyle({}, { cartoon: { color: scheme } });
      viewer.render();
    }
  }

  function toggleSpin() {
    if (viewer.spin) {
      // 3Dmol has a built-in spin toggle
      viewer.spin('y'); 
    }
  }

  function rattle() {
    if (!currentModel) return;
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.vibrate();
    
    var count = 0;
    var interval = setInterval(function() {
      // Rapidly rotate the molecule a tiny bit in random directions
      var dx = (Math.random() - 0.5) * 3;
      var dy = (Math.random() - 0.5) * 3;
      viewer.rotate(dx, dy, 0);
      viewer.render();
      count++;
      if (count > 15) {
        clearInterval(interval);
      }
    }, 40);
  }
</script>
</body>
</html>
