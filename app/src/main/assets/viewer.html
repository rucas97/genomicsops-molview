<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #06080A; overflow: hidden; width: 100%; height: 100%; }
  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #06080A; }
  @keyframes shake { 0% { transform: translate(2px, 1px) rotate(0deg); } 10% { transform: translate(-2px, -3px) rotate(-1deg); } 20% { transform: translate(-4px, 0px) rotate(1deg); } 30% { transform: translate(4px, 3px) rotate(0deg); } 40% { transform: translate(2px, -2px) rotate(1deg); } 50% { transform: translate(-2px, 3px) rotate(-1deg); } 60% { transform: translate(-4px, 2px) rotate(0deg); } 70% { transform: translate(4px, 2px) rotate(-1deg); } 80% { transform: translate(-2px, -2px) rotate(1deg); } 90% { transform: translate(2px, 3px) rotate(0deg); } 100% { transform: translate(2px, -3px) rotate(-1deg); } }
  .rattling { animation: shake 0.4s; animation-iteration-count: 2; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#06080A', antialias: false });
  var currentModel = null, currentRep = 'cartoon', currentColorMode = 'rainbow', isSpinning = false, showHydrogens = true;
  var selectedResidue = null; 

  function deselect() {
    if (selectedResidue) {
      selectedResidue = null;
      applyStyle();
      viewer.zoomTo({}, 600); 
      viewer.render();
      // Tell Kotlin to clear the highlighted FASTA letter
      if (typeof AndroidLogger !== 'undefined') AndroidLogger.onDeselected();
    }
  }

  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  document.body.addEventListener('touchstart', function(e) {
    touchStartTime = Date.now(); touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
  }, {passive: true});

  document.body.addEventListener('touchend', function(e) {
    let duration = Date.now() - touchStartTime;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (duration < 200 && Math.sqrt(dx*dx + dy*dy) < 10) {
      deselect();
    }
  }, {passive: true});

  function loadModel(data, ext) {
    try {
      viewer.removeAllModels(); viewer.removeAllSurfaces(); viewer.removeAllShapes();
      isSpinning = false; showHydrogens = true; selectedResidue = null;
      currentModel = viewer.addModel(data, ext);
      applyStyle();
      setTimeout(function() { 
        viewer.zoomTo({}, 0); 
        viewer.render(); 
      }, 150);
    } catch(e) { if (typeof AndroidLogger !== 'undefined') AndroidLogger.log("Parse Error: " + e.message); }
  }

  function applyStyle() {
    if (!currentModel) return;
    viewer.removeAllSurfaces();
    var isCartoon = (currentRep === 'cartoon' || currentRep === 'surface');
    
    // Reverted to native 3Dmol spectrum (never fails)
    if (currentColorMode === 'rainbow') {
      if (isCartoon) viewer.setStyle({}, { cartoon: { color: 'spectrum' } });
      else if (currentRep === 'ballstick') viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'spectrum' }, sphere: { scale: 0.25, colorscheme: 'spectrum' } });
      else viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'spectrum' } });
    } else if (currentColorMode === 'chain') {
      if (isCartoon) viewer.setStyle({}, { cartoon: { colorscheme: 'chain' } });
      else if (currentRep === 'ballstick') viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'chain' }, sphere: { scale: 0.25, colorscheme: 'chain' } });
      else viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: 'chain' } });
    } else if (currentColorMode === 'ligand') {
      if (isCartoon) {
        viewer.setStyle({ hetflag: false }, { cartoon: { color: '#8B949E' } });
        viewer.setStyle({ hetflag: true }, { stick: { colorscheme: 'greenCarbon', radius: 0.2 } });
      } else {
        viewer.setStyle({ hetflag: false }, { stick: { radius: 0.15, color: '#8B949E' } });
        viewer.setStyle({ hetflag: true }, { stick: { radius: 0.2, colorscheme: 'greenCarbon' } });
      }
    }
    
    // Highlight selected residue in bright CYAN
    if (selectedResidue) {
      viewer.addStyle({ chain: selectedResidue.chain, resi: selectedResidue.resi }, { cartoon: { color: '#00FFFF' }, stick: { color: '#00FFFF', radius: 0.3 } });
    }
    
    if (currentRep === 'surface') {
      viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.85, color: 'white' }, { model: currentModel });
    }
    if (!showHydrogens) viewer.setStyle({ elem: 'H' }, {});
    viewer.render();
  }

  function setRep(rep) { currentRep = rep; applyStyle(); }
  function setColor(mode) { currentColorMode = mode; applyStyle(); }
  function toggleSpin() { isSpinning = !isSpinning; viewer.spin(isSpinning ? 'y' : false); }
  function toggleHydrogens() { showHydrogens = !showHydrogens; if (!showHydrogens) viewer.setStyle({ elem: 'H' }, {}); else applyStyle(); viewer.render(); }
  function resetView() { if (currentModel) { selectedResidue = null; applyStyle(); viewer.zoomTo({}, 600); viewer.render(); } }
  
  function rattle() {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.vibrate();
    var canvas = document.querySelector('canvas');
    if (canvas) { canvas.classList.remove('rattling'); void canvas.offsetWidth; canvas.classList.add('rattling'); setTimeout(function() { canvas.classList.remove('rattling'); }, 800); }
  }
  
  function highlightResidue(chain, resi) {
    if (!currentModel) return;
    selectedResidue = { chain: chain, resi: resi };
    applyStyle();
    viewer.zoomTo({ chain: chain, resi: resi }, 600); 
    viewer.render();
  }
</script>
</body>
</html>
