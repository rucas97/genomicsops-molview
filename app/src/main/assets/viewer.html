<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  /* Change body to red to prove the HTML is taking up space */
  html,body{margin:0;height:100%;background:red;overflow:hidden;}
  #viewer{width:100vw;height:100vh;position:absolute;inset:0}
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  function log(msg) {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.log(msg);
  }

  log("1. HTML Loaded");
  
  if (typeof $3Dmol === 'undefined') {
    log("ERROR: 3Dmol.js failed to load.");
  } else {
    log("2. 3Dmol Engine Detected");
    
    // Force a blue background for the 3D scene
    var viewer = $3Dmol.createViewer('viewer', { backgroundColor: 'blue' });
    
    // Load a test molecule (Ethanol) immediately
    var testModel = viewer.addModel("CCO", "sdf");
    viewer.setStyle({}, {stick: {}});
    viewer.zoomTo();
    viewer.render();
    
    log("3. Test Molecule Rendered");

    // Force a resize after 500ms just in case the Android layout wasn't ready
    setTimeout(function() {
      viewer.resize();
      viewer.render();
      log("4. Forced Resize Complete");
    }, 500);
    
    var currentModel = null;

    function loadModel(data, ext) {
      log("5. Received data: " + data.length + " chars");
      try {
        viewer.removeAllModels();
        currentModel = viewer.addModel(data, ext);
        viewer.zoomTo();
        setRep('cartoon');
        viewer.resize(); 
        viewer.render();
        log("6. Render Complete!");
      } catch(e) {
        log("Parse Error: " + e.message);
      }
    }

    function setRep(rep) {
      if (!currentModel) return;
      var style;
      if (rep === 'cartoon') style = { cartoon: { color: 'spectrum' } };
      else if (rep === 'surface') style = { cartoon: { color: 'spectrum' }, surface: { opacity: 0.8, color: 'white' } };
      else if (rep === 'ballstick') style = { stick: { radius: 0.15 }, sphere: { scale: 0.25 } };
      else style = { stick: { radius: 0.15 } };
      viewer.setStyle({}, style);
      viewer.render();
    }
  }
</script>
</body>
</html>
