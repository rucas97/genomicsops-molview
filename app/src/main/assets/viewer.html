<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  html,body{margin:0;height:100%;background:red;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #viewer{width:100vw;height:100vh;position:absolute;inset:0;background:blue;}
  #message{color:white;font-size:24px;font-family:sans-serif;z-index:999;text-align:center;background:black;padding:20px}
</style>
</head>
<body>
<div id="message">Testing WebGL...</div>
<div id="viewer"></div>
<script>
  function log(msg) {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.log(msg);
    document.getElementById('message').innerText = msg;
  }

  // Test basic WebGL support
  var canvas = document.createElement('canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    log("ERROR: WebGL is NOT supported on this WebView!");
  } else {
    log("WebGL Supported. Creating viewer...");
    
    try {
      // Create the viewer
      var viewer = $3Dmol.createViewer('viewer', { backgroundColor: 'blue' });
      
      // Hide the black message box so we can see the 3D canvas
      document.getElementById('message').style.display = 'none';
      
      // Add a single red sphere to prove rendering works
      viewer.addSphere({center: {x:0, y:0, z:0}, radius: 10, color: 'red'});
      viewer.zoomTo();
      viewer.render();
      
      log("Render Test Complete");
      setTimeout(function() { document.getElementById('message').style.display = 'none'; }, 2000);
    } catch(e) {
      log("3Dmol Error: " + e.message);
    }
  }
</script>
</body>
</html>
