<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #06080A; overflow: hidden; width: 100%; height: 100%; }
  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #06080A; }
  @keyframes shake {
    0% { transform: translate(2px, 1px) rotate(0deg); }
    10% { transform: translate(-2px, -3px) rotate(-1deg); }
    20% { transform: translate(-4px, 0px) rotate(1deg); }
    30% { transform: translate(4px, 3px) rotate(0deg); }
    40% { transform: translate(2px, -2px) rotate(1deg); }
    50% { transform: translate(-2px, 3px) rotate(-1deg); }
    60% { transform: translate(-4px, 2px) rotate(0deg); }
    70% { transform: translate(4px, 2px) rotate(-1deg); }
    80% { transform: translate(-2px, -2px) rotate(1deg); }
    90% { transform: translate(2px, 3px) rotate(0deg); }
    100% { transform: translate(2px, -3px) rotate(-1deg); }
  }
  .rattling { animation: shake 0.4s; animation-iteration-count: 2; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#06080A', antialias: false });
  var currentModel = null;
  var currentRep = 'cartoon';
  var currentColor = 'spectrum';
  var isSpinning = false;

  function loadModel(data, ext) {
    try {
      viewer.removeAllModels();
      viewer.removeAllSurfaces();
      isSpinning = false;
      currentModel = viewer.addModel(data, ext);
      viewer.zoomTo();
      setRep(currentRep);
    } catch(e) {
      if (typeof AndroidLogger !== 'undefined') AndroidLogger.log("Parse Error: " + e.message);
    }
  }

  function setRep(rep) {
    currentRep = rep;
    if (!currentModel) return;
    viewer.removeAllSurfaces();
    
    // Use colorscheme: instead of color: to prevent black screens
    if (rep === 'cartoon') {
      viewer.setStyle({}, { cartoon: { colorscheme: currentColor } });
      viewer.render();
    } else if (rep === 'surface') {
      viewer.setStyle({}, { cartoon: { colorscheme: currentColor } });
      viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.85, color: 'white' }, { model: currentModel });
      viewer.render();
    } else if (rep === 'ballstick') {
      viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: currentColor }, sphere: { scale: 0.25, colorscheme: currentColor } });
      viewer.render();
    } else if (rep === 'stick') {
      viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: currentColor } });
      viewer.render();
    }
  }

  function setColor(scheme) {
    currentColor = scheme;
    setRep(currentRep); // Re-apply the current representation with the new color
  }

  function toggleSpin() {
    isSpinning = !isSpinning;
    viewer.spin(isSpinning ? 'y' : false);
  }

  function rattle() {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.vibrate();
    var canvas = document.querySelector('canvas');
    if (canvas) {
      canvas.classList.remove('rattling');
      void canvas.offsetWidth;
      canvas.classList.add('rattling');
      setTimeout(function() { canvas.classList.remove('rattling'); }, 800);
    }
  }
</script>
</body>
</html>
