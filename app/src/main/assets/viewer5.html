<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  /* Use 100% instead of 100vh to ensure Android WebView respects the height */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0000ff; overflow: hidden; }
  #viewer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  function log(msg) {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.log(msg);
  }

  if (typeof $3Dmol === 'undefined') {
    log("ERROR: 3Dmol.js failed to load.");
  } else {
    var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#0000ff' });
    
    // Test sphere
    viewer.addSphere({center: {x:0, y:0, z:0}, radius: 10, color: 'red'});
    viewer.zoomTo();
    viewer.render();
    
    setTimeout(function() {
        var canvas = document.querySelector('canvas');
        log("Canvas Size: " + (canvas ? canvas.width + "x" + canvas.height : "None"));
    }, 1000);
    
    var currentModel = null;

    function loadModel(data, ext) {
      try {
        viewer.removeAllModels();
        currentModel = viewer.addModel(data, ext);
        viewer.zoomTo();
        setRep('cartoon');
        viewer.resize(); 
        viewer.render();
        log("Render Complete!");
      } catch(e) {
        log("Parse Error: " + e.message);
      }
    }

    function setRep(rep) {
      if (!currentModel) return;
      var style;
      if (rep === 'cartoon') style = { cartoon: { color: 'spectrum' } };
      else if (rep === 'surface') style = { cartoon: { color: 'spectrum' }, surface: { opacity: 0.8, color: 'white' } };
      else if (rep === 'ballstick') style = { stick: { radius: 0.15 }, sphere: { scale: 0.25 } };
      else style = { stick: { radius: 0.15 } };
      viewer.setStyle({}, style);
      viewer.render();
    }
  }
</script>
</body>
</html>
