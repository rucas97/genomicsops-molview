<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ff0000; overflow: hidden; }
  #viewer { background: #0000ff; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>
  function log(msg) {
    if (typeof AndroidLogger !== 'undefined') AndroidLogger.log(msg);
  }

  if (typeof $3Dmol === 'undefined') {
    log("ERROR: 3Dmol.js failed to load.");
  } else {
    // 1. Get screen dimensions, fallback to window.innerHeight
    var w = window.innerWidth || window.screen.width || 1080;
    var h = window.innerHeight || window.screen.height || 1920;

    // 2. Force the HTML elements to exactly that size
    document.documentElement.style.width = w + 'px';
    document.documentElement.style.height = h + 'px';
    document.body.style.width = w + 'px';
    document.body.style.height = h + 'px';
    
    var container = document.getElementById('viewer');
    container.style.width = w + 'px';
    container.style.height = h + 'px';

    // 3. Create the viewer with explicit width/height
    var viewer = $3Dmol.createViewer(container, { 
      backgroundColor: '#0000ff',
      width: w,
      height: h
    });
    
    // 4. Test sphere
    viewer.addSphere({center: {x:0, y:0, z:0}, radius: 10, color: 'red'});
    viewer.zoomTo();
    viewer.render();
    
    setTimeout(function() {
        var canvas = document.querySelector('canvas');
        log("Final Size: " + (canvas ? canvas.width + "x" + canvas.height : "None"));
    }, 1000);
    
    var currentModel = null;

    function loadModel(data, ext) {
      try {
        viewer.removeAllModels();
        currentModel = viewer.addModel(data, ext);
        viewer.zoomTo();
        setRep('cartoon');
        viewer.resize(w, h); // Force resize to exact dimensions
        viewer.render();
        log("Render Complete!");
      } catch(e) {
        log("Parse Error: " + e.message);
      }
    }

    function setRep(rep) {
      if (!currentModel) return;
      var style;
      if (rep === 'cartoon') style = { cartoon: { color: 'spectrum' } };
      else if (rep === 'surface') style = { cartoon: { color: 'spectrum' }, surface: { opacity: 0.8, color: 'white' } };
      else if (rep === 'ballstick') style = { stick: { radius: 0.15 }, sphere: { scale: 0.25 } };
      else style = { stick: { radius: 0.15 } };
      viewer.setStyle({}, style);
      viewer.render();
    }
  }
</script>
</body>
</html>
