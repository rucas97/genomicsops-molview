<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="3Dmol-min.js"></script>
<style>
  /* Use Flexbox instead of absolute positioning */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ff0000; overflow: hidden; display: flex; flex-direction: column; }
  
  /* The 3D canvas container will fill the remaining space */
  #viewer { flex: 1; width: 100%; background: #0000ff; }
  
  /* The debug text box */
  #msg { position: absolute; top: 20px; left: 20px; z-index: 99; color: white; background: black; padding: 10px; font-size: 16px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="msg">Initializing...</div>
<script>
  var msg = document.getElementById('msg');
  
  // 1. Test WebGL
  var canvas = document.createElement('canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  
  if (!gl) {
    msg.innerText = "ERROR: WebGL is NOT supported on this WebView!";
  } else {
    msg.innerText = "WebGL Supported.\nChecking 3Dmol...";
    
    // 2. Test 3Dmol
    if (typeof $3Dmol === 'undefined') {
      msg.innerText += "\nERROR: 3Dmol.js failed to load.";
    } else {
      msg.innerText += "\n3Dmol Loaded. Rendering test sphere...";
      
      try {
        // Create viewer
        var viewer = $3Dmol.createViewer('viewer', { backgroundColor: '#0000ff' });
        
        // Draw a red sphere
        viewer.addSphere({center: {x:0, y:0, z:0}, radius: 10, color: 'red'});
        viewer.zoomTo();
        viewer.render();
        
        msg.innerText += "\nSUCCESS: Sphere rendered!";
        
        // Hide debug box after 3 seconds so you can see the sphere clearly
        setTimeout(function() { msg.style.display = 'none'; }, 3000);
        
      } catch(e) {
        msg.innerText += "\n3Dmol Error: " + e.message;
      }
    }
  }
</script>
</body>
</html>
