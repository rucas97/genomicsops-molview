<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  /* RED background for the body */
  html, body { margin:0; padding:0; width:100%; height:100%; background:#ff0000; overflow:hidden; }
  /* BLUE background for the viewer, using safe absolute positioning */
  #viewer { width:100%; height:100%; position:absolute; top:0; left:0; right:0; bottom:0; background:#0000ff; }
</style>
</head>
<body>
<div id="viewer"></div>
<div style="position:absolute; top:20px; left:20px; z-index:9999; color:white; background:black; padding:10px; font-size:20px; font-family:sans-serif;">
  <span id="msg">HTML Loaded...</span>
</div>
<script>
  document.getElementById('msg').innerText = "JAVASCRIPT IS RUNNING!";
  if (typeof AndroidLogger !== 'undefined') AndroidLogger.log("JS is running in viewer2.html!");
</script>
</body>
</html>
